services:

  # ─────────────────────────────────────────
  # BACKEND — FastAPI
  # Sin base de datos propia: lee de ClickHouse (capa Plata del
  # pipeline Tángara), configurado vía CLICKHOUSE_* en backend/.env
  # ─────────────────────────────────────────
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecobytes_api
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"         # http://localhost:8000
    volumes:
      - ./Backend:/app      # hot-reload: cambios en el código se reflejan sin reconstruir
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
