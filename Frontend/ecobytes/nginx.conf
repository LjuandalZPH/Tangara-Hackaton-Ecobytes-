server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # go_router usa rutas del navegador (no hash) — cualquier ruta que
    # no sea un archivo real cae en index.html para que el router de
    # Flutter la resuelva del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
