name: ecobytes
description: "EcoBytes — Monitoreo de calidad del aire en Cali, Colombia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navegación
  go_router: ^15.1.2

  # Tipografía
  google_fonts: ^6.2.1

  # Gestión de estado
  provider: ^6.1.2

  # Cliente HTTP para consumir el backend
  http: ^1.2.2

  # Mapa interactivo
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Gráficos de líneas (vista detalle móvil)
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Copia literal de Backend/data/educacion.json. Es el respaldo que usa
    # /aprende cuando no hay backend, para que la pantalla no quede vacía.
    # Si editas el JSON del backend, vuelve a copiarlo (ver Backend/data/README.md).
    - assets/educacion.json
